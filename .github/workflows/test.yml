name: Validate assistant
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements.txt'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate_chat_calculation.py
      - run: python scripts/evaluate_chat_transcription.py
      - run: python scripts/evaluate_chat_evidence.py
      - run: python scripts/evaluate_daily_conversations.py
      - run: python scripts/evaluate_device_components.py
      - run: python scripts/learning/prepare_epistemic.py
      - run: python scripts/evaluate.py
      - run: python scripts/evaluate_context.py
      - run: python scripts/evaluate_documents.py
      - run: python scripts/evaluate_search.py
      - run: python scripts/evaluate_understanding.py
      - run: python scripts/evaluate_understanding.py --suite evals/claim_states.json
      - run: python scripts/evaluate_understanding.py --suite evals/function_claim_extraction.json
      - run: python scripts/evaluate_understanding.py --suite evals/communication_context.json
      - run: python scripts/evaluate_understanding.py --suite evals/companion_profile.json
      - run: python scripts/evaluate_understanding.py --suite evals/product_help.json
      - run: python scripts/evaluate_understanding.py --suite evals/delivery_generalization.json
      - run: python scripts/evaluate_understanding.py --suite evals/transcription.json
      - run: python scripts/evaluate_understanding.py --suite evals/transcription_fidelity.json
      - run: python scripts/evaluate_understanding.py --suite evals/transcription_sources.json
      - run: python scripts/evaluate_understanding.py --suite evals/transcription_escapes.json
      - run: python scripts/evaluate_understanding.py --suite evals/work_comprehension.json
      - run: python scripts/evaluate_understanding.py --suite evals/evidence_reasoning.json
      - run: python scripts/evaluate_understanding.py --suite evals/evidence_reasoning_holdout.json
      - run: python scripts/evaluate_understanding.py --suite evals/work_context_budget.json
      - run: python scripts/evaluate_understanding.py --suite evals/topic_context.json
      - run: python scripts/evaluate_goal_drafts.py
      - run: python scripts/evaluate_goal_drafts.py --suite evals/goal_draft_inputs.json
      - run: python scripts/evaluate_goal_drafts.py --suite evals/goal_draft_planning.json
      - run: python scripts/evaluate_goal_handoff.py
      - run: python scripts/evaluate_goal_replies.py
      - run: python scripts/evaluate_json_documents.py
      - run: python scripts/evaluate_json_statistics.py
      - run: python scripts/evaluate_tool_recovery.py
      - run: python scripts/evaluate_date_months.py
      - run: python scripts/evaluate_docx_reading.py
      - run: python scripts/evaluate_pdf_reading.py
      - run: python scripts/evaluate_exact_calculation.py
      - run: python scripts/evaluate_feedback_order.py
      - run: python scripts/evaluate_conversation_text.py
      - run: python scripts/evaluate_conversation_priority.py
      - run: python scripts/evaluate_conversation_search.py
      - run: python scripts/evaluate_conversation_search.py --suite evals/conversation_window.json
      - run: python scripts/evaluate_conversation_search.py --suite evals/expression_calculation.json
      - run: python scripts/evaluate_conversation_search.py --suite evals/expression_diagnostics.json
      - run: python scripts/evaluate_conversation_search.py --suite evals/number_rounding.json
      - run: python scripts/evaluate_conversation_search.py --suite evals/month_schedule.json
      - run: python scripts/evaluate_understanding.py --suite evals/communication_scope.json
      - run: python scripts/evaluate_understanding.py --suite evals/quote_continuity.json
      - run: python scripts/evaluate_understanding.py --suite evals/recent_budget.json
      - run: python scripts/evaluate_understanding.py --suite evals/direction_changes.json
      - run: python scripts/evaluate_csv_membership.py
      - run: python scripts/evaluate_csv_membership.py --suite evals/csv_median.json
      - run: python scripts/evaluate_csv_membership.py --suite evals/csv_grouping.json
      - run: python scripts/evaluate_images.py
      - run: python scripts/evaluate_goal_status.py
      - run: python scripts/evaluate_goal_discussion.py
      - run: python scripts/evaluate_reasoning_pair.py --profile baseline --out data/evaluations/offline-reasoning-baseline
      - run: python scripts/evaluate_reasoning_pair.py --profile challenge --seed 20261104 --out data/evaluations/offline-reasoning-challenge
      - run: python scripts/evaluate_tasks.py
      - run: python scripts/evaluate_workflows.py
      - run: python scripts/evaluate_memory_commands.py
      - run: python scripts/evaluate_answer_runs.py
