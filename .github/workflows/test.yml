name: Validate assistant
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py
      - run: python scripts/evaluate_context.py
      - run: python scripts/evaluate_documents.py
      - run: python scripts/evaluate_search.py
      - run: python scripts/evaluate_understanding.py
      - run: python scripts/evaluate_understanding.py --suite evals/communication_context.json
      - run: python scripts/evaluate_understanding.py --suite evals/companion_profile.json
      - run: python scripts/evaluate_understanding.py --suite evals/product_help.json
      - run: python scripts/evaluate_understanding.py --suite evals/topic_context.json
      - run: python scripts/evaluate_tasks.py
      - run: python scripts/evaluate_workflows.py
      - run: python scripts/evaluate_memory_commands.py
      - run: python scripts/evaluate_answer_runs.py
